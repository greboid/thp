name: Test and Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  test:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - uses: actions/toolkit/go-test@master
  container:
    runs-on: alpine
    needs: [test]
    steps:
      - uses: actions/toolkit/git-checkout@master
        with:
          audience: u:1:e7c48982-76d3-4d0e-8dd3-95729d0eb9c5
          ghcr: ${{ secrets.MIRROR_TOKEN }}
      - name: Build and push image
        uses: actions/toolkit/docker-push@master
        with:
          file: Containerfile
          ghcr: true
  release:
    if: github.ref_type == 'tag'
    runs-on: alpine
    needs:
      - test
      - container
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/docker-login@master
        with:
          audience: u:1:e7c48982-76d3-4d0e-8dd3-95729d0eb9c5
          ghcr: ${{ secrets.MIRROR_TOKEN }}
      - name: Build and push image
        uses: actions/toolkit/docker-push@master
        with:
          file: Containerfile
          ghcr: true
